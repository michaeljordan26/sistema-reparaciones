# Reglas de acceso de la base PRIMARIA db-facturacion (Sprint 7).
# Igual a las de la imagen oficial de PostgreSQL, más la línea de replicación.
# TIPO   BASE          USUARIO   DIRECCIÓN       MÉTODO
local    all           all                       trust
host     all           all       127.0.0.1/32    trust
host     all           all       ::1/128         trust
local    replication   all                       trust
host     replication   all       127.0.0.1/32    trust
host     replication   all       ::1/128         trust
# La réplica (otro contenedor) se conecta por la red de Docker con usuario y contraseña
host     replication   all       all             scram-sha-256
host     all           all       all             scram-sha-256
