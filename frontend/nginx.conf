# En Docker, nginx cumple el mismo papel que el proxy de Vite en desarrollo:
# /api/<servicio>/... se reenvía al contenedor del microservicio (sin el prefijo /api/<servicio>).
server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interno de Docker. Los nombres se resuelven en cada petición (no solo al arrancar),
    # así nginx no se cae si algún microservicio todavía no está listo o se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;

    location /api/usuarios/     { set $destino ms-usuarios:8001;     rewrite ^/api/usuarios/(.*)$ /$1 break;     proxy_pass http://$destino; }
    location /api/clientes/     { set $destino ms-clientes:8002;     rewrite ^/api/clientes/(.*)$ /$1 break;     proxy_pass http://$destino; }
    location /api/ordenes/      { set $destino ms-ordenes:8003;      rewrite ^/api/ordenes/(.*)$ /$1 break;      proxy_pass http://$destino; }
    location /api/reparaciones/ { set $destino ms-reparaciones:8004; rewrite ^/api/reparaciones/(.*)$ /$1 break; proxy_pass http://$destino; }
    location /api/inventario/   { set $destino ms-inventario:8005;   rewrite ^/api/inventario/(.*)$ /$1 break;   proxy_pass http://$destino; }
    location /api/facturacion/  { set $destino ms-facturacion:8006;  rewrite ^/api/facturacion/(.*)$ /$1 break;  proxy_pass http://$destino; }
    location /api/reportes/     { set $destino ms-reportes:8007;     rewrite ^/api/reportes/(.*)$ /$1 break;     proxy_pass http://$destino; }

    # Si un microservicio no responde, se devuelve un JSON que la interfaz sabe mostrar
    error_page 502 503 504 = @servicio_caido;
    location @servicio_caido {
        default_type application/json;
        return 503 '{"detail":"El servicio no está disponible en este momento. Revise: docker compose ps"}';
    }

    # Archivos estáticos con caché; index.html sin caché para ver siempre la última versión
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
