# =====================================================================
# Interfaz web (React compilado + nginx)
# Service tipo NodePort: Docker Desktop la publica en http://localhost:30173
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: taller
  labels: {app: frontend}
spec:
  type: NodePort
  selector: {app: frontend}
  ports:
    - {name: http, port: 80, targetPort: 80, nodePort: 30173}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taller
spec:
  replicas: 2                  # Dos copias: si una cae, la otra sigue atendiendo
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend, capa: presentacion}
    spec:
      containers:
        - name: nginx
          image: taller/frontend:1.0
          imagePullPolicy: Never
          ports:
            - {containerPort: 80}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:          # Cambia la configuración de nginx por la de Kubernetes
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap: {name: frontend-nginx}
